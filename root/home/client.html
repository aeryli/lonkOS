<html>
<head>
  <title>Simple client</title>
  <script type="text/javascript">
    var ws;
    
    function init() {
      ws = new WebSocket("ws://localhost:9001/");                                             //Connect
                                                                                             //Events
      ws.onopen = function() { output("connected"); };                                      //connected
      ws.onmessage = function(e) { let lastmsg = e.data; output("recieved: " + e.data); }; //received message
      ws.onclose = function() { output("disconnected"); };                                //disconnected
      ws.onerror = function(e) { output(`error: ${e.message}`); console.log(e); };       //error happened
    }
    
    function onSubmit() {
      var input = document.getElementById("input");
      ws.send(input.value);
      output("send: " + input.value);
      input.value = "";
      input.focus();
    }
    function output(str) {
      var log = document.getElementById("log");
      var escaped = str.replace(/&/, "&amp;").replace(/</, "&lt;").
        replace(/>/, "&gt;").replace(/"/, "&quot;"); // "
      log.innerHTML = escaped + "<br>" + log.innerHTML;
    }
  </script>
</head>
<body onload="init();">
  <form onsubmit="onSubmit(); return false;">
    <input type="text" id="input">
    <input type="submit" value="Send">
    <button onclick="ws.close();">close</button>
  </form>
  <div id="log"></div>
</body>
</html>
